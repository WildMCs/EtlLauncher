name: Build EternalLauncher (experimental)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'patches/**'
      - 'branding/**'
      - 'tests/**'
      - 'public-news/**'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'patches/**'
      - 'branding/**'
      - 'tests/**'
      - 'public-news/**'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a private GitHub Release after the build succeeds'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

# Discord Application ID is a public identifier, never a bot token.
# Use the approved EternalLauncher ID by default; an Actions variable can override it.
env:
  ETERNAL_DISCORD_CLIENT_ID: ${{ vars.ETERNAL_DISCORD_CLIENT_ID || '1269391023797436426' }}
  MODRINTH_TAG: v0.23.5
  MODRINTH_COMMIT: e30eb38e77566cbca6502dad93142d5ba892cd87

concurrency:
  group: eternallauncher-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.15.0'
      - run: node --test
      - name: Require main for publication
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo 'Release publication requires the main branch.'
            exit 1
          fi

  build:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    outputs:
      upstream_tag: ${{ steps.upstream.outputs.tag }}
      upstream_sha: ${{ steps.upstream.outputs.sha }}
    timeout-minutes: 120
    steps:
      - name: Checkout EternalLauncher patch repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Select reviewed upstream or scheduled candidate
        id: upstream
        shell: pwsh
        run: |
          $tag = $env:MODRINTH_TAG
          $sha = $env:MODRINTH_COMMIT
          if ($env:GITHUB_EVENT_NAME -eq 'schedule') {
            $refs = git ls-remote --tags --sort=-version:refname https://github.com/modrinth/code.git 'refs/tags/v*'
            if ($LASTEXITCODE -ne 0) { throw 'Could not inspect Modrinth release tags.' }
            $latest = $refs | Where-Object { $_ -match '^([0-9a-f]{40})\s+refs/tags/v\d+\.\d+\.\d+$' } | Select-Object -First 1
            if (!$latest) { throw 'No stable Modrinth release tag found.' }
            $sha, $ref = $latest -split '\s+'
            $tag = $ref.Substring('refs/tags/'.Length)
            # Prefer the underlying commit when the tag is annotated.
            $peeled = $refs | Where-Object { $_.EndsWith("`t${ref}^{}") } | Select-Object -First 1
            if ($peeled) { $sha = ($peeled -split '\s+')[0] }
          }
          if ($tag -cnotmatch '^v\d+\.\d+\.\d+$' -or $sha -cnotmatch '^[0-9a-f]{40}$') {
            throw 'Invalid upstream source reference.'
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "Selected Modrinth $tag at $sha"

      - name: Avoid rebuilding unchanged upstream version
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build-marker/completed.txt
          key: eternallauncher-win-v3-${{ steps.upstream.outputs.sha }}-${{ hashFiles('patches/**', '.github/workflows/build.yml', 'branding/**') }}

      - name: Fetch official source
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          git init upstream
          if ($LASTEXITCODE -ne 0) { throw 'Could not initialize upstream checkout.' }
          git -C upstream fetch --depth 1 --no-tags https://github.com/modrinth/code.git "$env:UPSTREAM_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the selected Modrinth commit.' }
          git -C upstream checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not check out the selected Modrinth commit.' }
          $actual = git -C upstream rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:UPSTREAM_SHA) { throw 'Unexpected Modrinth source commit.' }

      - name: Apply guarded customization
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: python patches/patch_launcher.py

      - name: Apply Sakura branding, logo and pink theme
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: python patches/brand_launcher.py

      - name: Remove Hosting, add Eternal welcome and configure Discord Rich Presence
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: python patches/eternal_features.py

      - name: Check Discord Rich Presence application ID
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          if ($env:ETERNAL_DISCORD_CLIENT_ID) {
            if ($env:ETERNAL_DISCORD_CLIENT_ID -notmatch '^[0-9]{17,20}$') {
              throw 'ETERNAL_DISCORD_CLIENT_ID must be a 17-20 digit Discord Application ID.'
            }
            Write-Host 'Discord Rich Presence will use the configured EternalLauncher application.'
          } else {
            Write-Host 'No custom Discord application ID configured; Discord Rich Presence is disabled to avoid using the official Modrinth identity.'
          }

      - name: Configure Eternal wallpaper and remote news
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: python patches/wallpaper_news_launcher.py

      - name: Install Sakura default and OLED-black menu modes
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: python patches/sakura_themes.py

      - name: Polish running buttons, skin focus and profile sidebar
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: python patches/ui_polish.py

      - name: Disable optional telemetry and remote error reports
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: python patches/privacy_launcher.py

      - name: Setup Node.js
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: upstream/.nvmrc

      - name: Setup pnpm
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: upstream
        run: |
          corepack enable
          pnpm --version

      - name: Locate pnpm store
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        id: pnpm-store
        working-directory: upstream
        shell: pwsh
        run: |
          $store = pnpm store path
          if ($LASTEXITCODE -ne 0) { throw 'Could not locate pnpm store' }
          "path=$store" >> $env:GITHUB_OUTPUT

      - name: Reuse pnpm downloads between builds
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        id: pnpm-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: eternal-pnpm-win-${{ hashFiles('upstream/pnpm-lock.yaml') }}
          restore-keys: |
            eternal-pnpm-win-

      - name: Setup Rust
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        working-directory: upstream
        shell: pwsh
        run: rustc --version

      - name: Set up Java for launcher helpers
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reuse compiled Rust dependencies
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: upstream -> target

      - name: Install frontend dependencies
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        working-directory: upstream
        shell: pwsh
        run: |
          $start = Get-Date
          pnpm --filter '@modrinth/app...' install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'pnpm install failed' }
          $duration = [math]::Round(((Get-Date) - $start).TotalSeconds, 1)
          "- pnpm dependency install: **$duration seconds**" >> $env:GITHUB_STEP_SUMMARY
          "- pnpm cache hit: ${{ steps.pnpm-cache.outputs.cache-hit }}" >> $env:GITHUB_STEP_SUMMARY

      - name: Generate Tauri icons and verify the Windows icon
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        working-directory: upstream
        shell: pwsh
        run: |
          $iconPath = 'apps/app/icons/eternal.ico'
          pnpm --filter @modrinth/app tauri icon "$env:GITHUB_WORKSPACE/branding/logo.png" --output "$env:GITHUB_WORKSPACE/upstream/apps/app/icons"
          if ($LASTEXITCODE -ne 0) { throw 'Tauri icon generation failed' }
          foreach ($requiredIcon in @($iconPath, 'apps/app/icons/128x128.png', 'apps/app/icons/128x128@2x.png')) {
            if (!(Test-Path $requiredIcon)) { throw "Icon generation failed: $requiredIcon missing" }
            if ((Get-Item $requiredIcon).Length -lt 500) { throw "Generated icon is unexpectedly small: $requiredIcon" }
          }
          $expectedHash = (Get-FileHash "$env:GITHUB_WORKSPACE/branding/icons/EternalLauncher.ico" -Algorithm SHA256).Hash
          $bundledHash = (Get-FileHash $iconPath -Algorithm SHA256).Hash
          if ($bundledHash -cne $expectedHash) { throw 'The Windows icon differs from the EternalLauncher icon pack' }
          Write-Host "Verified EternalLauncher Windows icon: $bundledHash"

      - name: Configure official Modrinth build environment
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $source = 'upstream/packages/app-lib/.env.prod'
          $destination = 'upstream/packages/app-lib/.env'
          if (!(Test-Path $source)) { throw "Missing upstream production environment template: $source" }
          Copy-Item -LiteralPath $source -Destination $destination -Force
          $required = @(
            'MODRINTH_API_URL',
            'MODRINTH_API_URL_V3',
            'MODRINTH_API_BASE_URL',
            'SHARED_INSTANCES_API_BASE_URL',
            'MODRINTH_LAUNCHER_META_URL',
            'MODRINTH_SOCKET_URL',
            'MODRINTH_URL'
          )
          foreach ($key in $required) {
            if (!(Select-String -Path $destination -Pattern "^$key\s*=" -Quiet)) {
              throw "Production environment template does not define $key"
            }
          }
          Write-Host 'Official production environment file prepared; required keys found.'

      - name: Build Tauri NSIS installer
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        working-directory: upstream
        shell: pwsh
        run: |
          $start = Get-Date
          pnpm --filter @modrinth/app tauri build --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw 'Tauri/NSIS build failed' }
          $duration = [math]::Round(((Get-Date) - $start).TotalSeconds, 1)
          "- Tauri + NSIS compilation: **$duration seconds**" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload private Windows installer
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EternalLauncher-${{ steps.upstream.outputs.tag }}-windows-x64
          path: upstream/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Mark successful build
        if: success() && (github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .build-marker | Out-Null
          Set-Content .build-marker/completed.txt "${{ steps.upstream.outputs.tag }}"

  release:
    name: Publish private downloadable release
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download installer built by this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: EternalLauncher-${{ needs.build.outputs.upstream_tag }}-windows-x64
          path: release-assets

      - name: Validate installer and create SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          installers=( *.exe )
          if (( ${#installers[@]} != 1 )); then
            echo "Expected exactly one Windows installer, found ${#installers[@]}"
            exit 1
          fi
          sha256sum -- "${installers[0]}" > SHA256SUMS.txt
          echo "Prepared installer and checksum:"
          cat SHA256SUMS.txt

      - name: Publish private GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ needs.build.outputs.upstream_tag }}
          UPSTREAM_SHA: ${{ needs.build.outputs.upstream_sha }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          release_tag="eternal-${UPSTREAM_TAG}-build.${BUILD_NUMBER}.${BUILD_ATTEMPT}"
          title="EternalLauncher Sakura Edition ${UPSTREAM_TAG} (build ${BUILD_NUMBER}.${BUILD_ATTEMPT})"
          cat > release-notes.md <<EOF
          EternalLauncher Sakura Edition — private experimental Windows x64 build.

          Upstream Modrinth App: ${UPSTREAM_TAG} (${UPSTREAM_SHA})
          EternalLauncher patch commit: ${GITHUB_SHA}

          Includes a Windows NSIS installer and SHA256SUMS.txt for verification.

          This is an unofficial, unsigned, customized build. Back up your Minecraft
          instances before installing. Windows SmartScreen may show a warning.
          EOF
          gh release create "${release_tag}" release-assets/*.exe release-assets/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${title}" \
            --notes-file release-notes.md \
            --prerelease
          echo "Published private release ${release_tag}"
